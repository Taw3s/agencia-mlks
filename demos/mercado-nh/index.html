<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Tropical Side · Demonstração</title>
<meta name="description" content="Demonstração de site feita pela Paradoxum para a Tropical Side Brazilian Store, Nashua NH. Não é o site oficial.">
<meta name="theme-color" content="#0E7A3B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#0E7A3B; --green-2:#13A04D; --leaf:#D9F2E1; --sun:#FFB21E; --orange:#F2611D; --blue:#1666C5;
  --ink:#14211A; --muted:#4D5D53; --paper:#FFFDF7; --cream:#FFF4DC; --line:#E6E1D3;
  --display:'Baloo 2', system-ui, sans-serif; --body:'Nunito Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:18px; --gutter:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body)}
img{max-width:100%;display:block}
a{color:inherit}
.wrap{width:100%;max-width:1080px;margin:0 auto;padding:0 var(--gutter)}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

/* faixa de demonstração */
.demo{background:var(--ink);color:#fff;font:800 12px/1.35 var(--body);letter-spacing:.02em;text-align:center;padding:8px var(--gutter)}
.demo b{color:var(--sun)}

/* topo */
header{position:sticky;top:0;z-index:20;background:rgb(255 253 247 / .94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.slot{width:44px;height:44px;border-radius:50%;border:2px dashed var(--green-2);display:grid;place-items:center;font:800 9px/1.05 var(--body);color:var(--green);text-align:center;text-transform:uppercase;background:var(--leaf)}
.word{font:800 22px/1 var(--display);color:var(--green);letter-spacing:-.01em}
.word span{color:var(--blue)}
.word small{display:block;font:800 10px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.lang{display:flex;border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{font:800 13px/1 var(--body);min-width:46px;min-height:40px;border:0;background:transparent;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* abertura */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,var(--cream),var(--paper) 80%);padding:34px 0 0}
.sun{position:absolute;right:-150px;top:-90px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFD45C,var(--sun) 45%,var(--orange));opacity:.9}
.hero .wrap{position:relative;z-index:1}
.status{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:999px;padding:7px 14px 7px 10px;font:800 14px/1 var(--body);box-shadow:0 2px 0 rgb(0 0 0 / .04)}
.status i{width:11px;height:11px;border-radius:50%;background:#9AA59E;flex:none}
.status.open i{background:var(--green-2);box-shadow:0 0 0 0 rgb(19 160 77 / .5);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgb(19 160 77 / 0)}100%{box-shadow:0 0 0 0 rgb(19 160 77 / 0)}}
h1{font:800 clamp(40px,11vw,76px)/.98 var(--display);letter-spacing:-.02em;margin-top:16px;max-width:12ch}
h1 em{font-style:normal;color:var(--green)}
.lead{font-size:18px;color:var(--muted);margin-top:12px;max-width:34ch}
.ctas{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px;max-width:460px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:52px;padding:0 16px;border-radius:14px;font:800 15px/1 var(--body);text-decoration:none;border:2px solid transparent;transition:transform .15s}
.btn:active{transform:scale(.98)}
.btn svg{width:20px;height:20px;fill:currentColor;flex:none}
.btn.main{grid-column:1/-1;background:var(--green);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border-color:var(--ink)}
.waves{display:block;width:100%;height:70px;margin-top:30px}

/* seções */
section{padding:44px 0}
h2{font:800 clamp(30px,7.5vw,46px)/1.02 var(--display);letter-spacing:-.015em}
.sub{color:var(--muted);margin-top:8px;max-width:46ch}
.eyebrow{font:800 12px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--orange);margin-bottom:10px}

/* horários */
.hours{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.hours li{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--line);font-weight:600}
.hours li:first-child{border-top:0}
.hours li.today{background:var(--leaf);font-weight:800}
.hours li.today span:first-child::after{content:" · " attr(data-today);color:var(--green);font-weight:800}
.hours .off{color:var(--orange)}
.note{font-size:13px;color:var(--muted);margin-top:10px}

/* produtos */
.cats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
.cat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:16px 14px 18px;position:relative;overflow:hidden}
.cat::before{content:"";position:absolute;right:-26px;top:-26px;width:84px;height:84px;border-radius:50%;background:var(--c,var(--leaf));opacity:.9}
.cat h3{font:800 20px/1.1 var(--display);position:relative}
.cat p{font-size:14px;color:var(--muted);margin-top:6px;position:relative}
.cat .ic{position:relative;width:34px;height:34px;margin-bottom:10px;color:var(--ink)}

/* encomendas */
.order{background:var(--green);color:#fff;border-radius:26px;padding:28px 22px;position:relative;overflow:hidden}
.order::after{content:"";position:absolute;right:-70px;top:-70px;width:170px;height:170px;border-radius:50%;background:var(--sun);opacity:.9;z-index:0}
.order>*{z-index:1}
.order h2{color:#fff;position:relative;max-width:14ch}
.order p{position:relative;margin-top:10px;max-width:38ch;color:#E7F6EC}
.order .btn{position:relative;margin-top:18px;background:#fff;color:var(--green);width:100%;max-width:340px}

/* onde */
.map{margin-top:20px;border-radius:var(--r);overflow:hidden;border:1px solid var(--line);aspect-ratio:4/3;background:var(--leaf)}
.map iframe{width:100%;height:100%;border:0;display:block}
.addr{margin-top:14px;font-weight:700}

footer{background:var(--ink);color:#D5DDD8;padding:34px 0 calc(34px + env(safe-area-inset-bottom));font-size:14px}
footer .word{color:#fff}
footer .word small{color:#9FB0A6}
footer p{margin-top:12px}
footer a{color:#fff}
.credit{margin-top:22px;padding-top:16px;border-top:1px solid rgb(255 255 255 / .12);font-size:12px;color:#9FB0A6}

@media (min-width:760px){
  :root{--gutter:32px}
  .hero{padding-top:56px}
  .sun{width:440px;height:440px;right:-80px;top:-80px}
  .ctas{grid-template-columns:auto auto auto;max-width:none;justify-content:start}
  .btn.main{grid-column:auto}
  .cats{grid-template-columns:repeat(3,1fr)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
  .order{padding:44px}
}
</style>
</head>
<body>

<div class="demo" data-pt="<b>DEMONSTRAÇÃO</b> · proposta da Paradoxum para a Tropical Side. Este não é o site oficial da loja." data-en="<b>DEMO</b> · a proposal by Paradoxum for Tropical Side. This is not the store's official website."></div>

<header>
  <div class="wrap top">
    <a class="brand" href="#inicio" aria-label="Tropical Side Brazilian Store">
      <span class="slot" aria-hidden="true" data-pt="seu<br>logo" data-en="your<br>logo"></span>
      <span class="word">Tropical <span>Side</span><small>Brazilian Store</small></span>
    </a>
    <div class="lang" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="pt" aria-pressed="true">PT</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<main id="inicio">
  <div class="hero">
    <div class="sun" aria-hidden="true"></div>
    <div class="wrap">
      <span class="status" id="status" aria-live="polite"><i></i><span id="status-text">…</span></span>
      <h1 data-pt="O sabor do <em>Brasil</em> em Nashua" data-en="A taste of <em>Brazil</em> in Nashua"></h1>
      <p class="lead" data-pt="Queijos, carnes, salgados, bebidas e doces brasileiros. Tudo aqui pertinho, na Kinsley St." data-en="Brazilian cheeses, meats, snacks, drinks and sweets, right here on Kinsley St."></p>
      <div class="ctas">
        <a class="btn main" href="https://www.google.com/maps/dir/?api=1&destination=6+Kinsley+St,+Nashua,+NH+03060" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg><span data-pt="Como chegar" data-en="Get directions"></span></a>
        <a class="btn alt" href="tel:+16038808316"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg><span data-pt="Ligar" data-en="Call"></span></a>
        <a class="btn alt" href="https://www.instagram.com/tropicalsidenashua/" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 7.2a4.8 4.8 0 1 0 0 9.6 4.8 4.8 0 0 0 0-9.6zm0 7.9a3.1 3.1 0 1 1 0-6.2 3.1 3.1 0 0 1 0 6.2zM17 5.9a1.1 1.1 0 1 0 0 2.2 1.1 1.1 0 0 0 0-2.2zM20.9 7.1a5.6 5.6 0 0 0-1.5-3.9A5.6 5.6 0 0 0 15.5 1.6C14 1.5 10 1.5 8.5 1.6a5.6 5.6 0 0 0-3.9 1.5A5.6 5.6 0 0 0 3.1 7C3 8.5 3 12.5 3.1 14a5.6 5.6 0 0 0 1.5 3.9 5.6 5.6 0 0 0 3.9 1.5c1.5.1 5.5.1 7 0a5.6 5.6 0 0 0 3.9-1.5 5.6 5.6 0 0 0 1.5-3.9c.1-1.5.1-5.4 0-6.9zM19 15.7a3.1 3.1 0 0 1-1.8 1.8c-1.2.5-4.1.4-5.4.4s-4.2.1-5.4-.4a3.1 3.1 0 0 1-1.8-1.8c-.5-1.2-.4-4.1-.4-5.4s-.1-4.2.4-5.4A3.1 3.1 0 0 1 6.4 3c1.2-.5 4.1-.4 5.4-.4s4.2-.1 5.4.4a3.1 3.1 0 0 1 1.8 1.8c.5 1.2.4 4.1.4 5.4s.1 4.2-.4 5.4z"/></svg>Instagram</a>
      </div>
    </div>
    <svg class="waves" viewBox="0 0 1440 70" preserveAspectRatio="none" aria-hidden="true"><path d="M0 40C240 0 480 0 720 30s480 40 720 0V70H0z" fill="#13A04D"/><path d="M0 52C260 22 520 24 760 46s460 26 680 0V70H0z" fill="#0E7A3B"/></svg>
  </div>

  <section id="horarios">
    <div class="wrap two">
      <div>
        <p class="eyebrow" data-pt="Estamos abertos?" data-en="Are we open?"></p>
        <h2 data-pt="Horário de funcionamento" data-en="Store hours"></h2>
        <p class="sub" data-pt="O aviso lá em cima muda sozinho, no horário de Nashua." data-en="The badge at the top updates by itself, on Nashua time."></p>
      </div>
      <div>
        <ul class="hours" id="hours"></ul>
        <p class="note" data-pt="Feriados podem mudar o horário. Na dúvida, ligue antes." data-en="Hours may change on holidays. When in doubt, call ahead."></p>
      </div>
    </div>
  </section>

  <section id="produtos" style="padding-top:8px">
    <div class="wrap">
      <p class="eyebrow" data-pt="O que tem na loja" data-en="What we carry"></p>
      <h2 data-pt="Matando a saudade de casa" data-en="Your taste of home"></h2>
      <div class="cats" id="cats"></div>
      <p class="note" data-pt="Exemplos tirados dos posts da loja. A seleção muda toda semana." data-en="Examples from the store's posts. Selection changes every week."></p>
    </div>
  </section>

  <section id="encomendas" style="padding-top:8px">
    <div class="wrap">
      <div class="order">
        <h2 data-pt="Encomendas de fim de ano" data-en="Holiday orders"></h2>
        <p data-pt="Panetone, queijos e carnes para a ceia. Garanta o seu antes de acabar: é só mandar uma mensagem." data-en="Panettone, cheeses and meats for the holidays. Reserve yours before they run out: just send us a message."></p>
        <a class="btn" href="sms:+16038808316"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zM7 9h10v2H7zm6 5H7v-2h6zm4-6H7V6h10z"/></svg><span data-pt="Mandar mensagem" data-en="Send a message"></span></a>
      </div>
    </div>
  </section>

  <section id="onde" style="padding-top:8px">
    <div class="wrap two">
      <div>
        <p class="eyebrow" data-pt="Onde estamos" data-en="Find us"></p>
        <h2>6 Kinsley St</h2>
        <p class="addr">Nashua, NH 03060</p>
        <p class="sub"><a href="tel:+16038808316">+1 (603) 880-8316</a></p>
      </div>
      <div class="map"><iframe title="Mapa / Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=6+Kinsley+St,+Nashua,+NH+03060&output=embed"></iframe></div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span class="word">Tropical <span>Side</span><small>Brazilian Store</small></span>
    <p>6 Kinsley St, Nashua, NH 03060 · <a href="tel:+16038808316">+1 (603) 880-8316</a> · <a href="https://www.instagram.com/tropicalsidenashua/" target="_blank" rel="noopener">@tropicalsidenashua</a></p>
    <p class="credit" data-pt="Demonstração feita pela Paradoxum (web development · Estados Unidos &amp; Brasil). Logo, fotos e textos finais entram com a aprovação da loja." data-en="Demo by Paradoxum (web development · USA &amp; Brazil). Final logo, photos and copy are added with the store's approval."></p>
  </div>
</footer>

<script>
const HOURS = { 1:[9,19], 2:[9,19], 3:[9,19], 4:[9,19], 5:[9,19], 6:[9,17], 0:null }; // 0 = domingo
const DAYS = { pt:['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'], en:['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'] };
const T = {
  pt:{ open:'Aberto agora · fecha às ', closed:'Fechado agora', opensToday:'Fechado · abre hoje às ', opensTomorrow:'Fechado · abre amanhã às ', opensOn:'Fechado · abre ', at:' às ', off:'Fechado', today:'hoje' },
  en:{ open:'Open now · closes at ', closed:'Closed now', opensToday:'Closed · opens today at ', opensTomorrow:'Closed · opens tomorrow at ', opensOn:'Closed · opens ', at:' at ', off:'Closed', today:'today' }
};
const CATS = [
  { c:'#FFE3B3', pt:['Queijos','Minas frescal, meia-cura e requeijão.'], en:['Cheeses','Fresh and semi-aged Minas cheese, requeijão.'], ic:'M4 15l9-9 7 4v9H4zM9 15a1 1 0 1 0 0 .1M15 13a1.5 1.5 0 1 0 0 .1' },
  { c:'#FFD2C2', pt:['Carnes e linguiças','Cortes para churrasco e linguiça toscana.'], en:['Meats & sausages','BBQ cuts and toscana sausage.'], ic:'M6 14c-2-4 2-9 7-8s7 6 5 9-8 4-12-1zM9 12a1 1 0 1 0 0 .1' },
  { c:'#D9F2E1', pt:['Congelados','Pão de queijo, coxinha, croquete e pão de alho.'], en:['Frozen','Cheese bread, coxinha, croquettes, garlic bread.'], ic:'M12 3v18M4.5 7.5l15 9M19.5 7.5l-15 9' },
  { c:'#D6E7FF', pt:['Bebidas','Guaraná, sucos e refrigerantes do Brasil.'], en:['Drinks','Guaraná, juices and Brazilian sodas.'], ic:'M9 3h6M10 3v4l-3 4v9a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1v-9l-3-4V3' },
  { c:'#FFF0A8', pt:['Salgadinhos e doces','Biscoitos, chocolates e salgadinhos.'], en:['Snacks & sweets','Cookies, chocolates and chips.'], ic:'M7 4h10l-1 16H8zM7 8h10' },
  { c:'#FFD9E6', pt:['Mercearia','Temperos, farofa, feijão e tudo do dia a dia.'], en:['Pantry','Seasonings, farofa, beans and everyday staples.'], ic:'M5 8h14l-1.5 12h-11zM9 8V6a3 3 0 0 1 6 0v2' }
];
let lang = 'pt';
try { const salvo = localStorage.getItem('ts-lang'); if (salvo === 'pt' || salvo === 'en') lang = salvo; } catch (e) {}

const fmt = h => lang === 'pt' ? `${h}h` : `${((h + 11) % 12) + 1} ${h < 12 ? 'AM' : 'PM'}`;
function nyNow() {
  const p = Object.fromEntries(new Intl.DateTimeFormat('en-US', { timeZone:'America/New_York', weekday:'short', hour:'numeric', minute:'numeric', hourCycle:'h23' }).formatToParts(new Date()).map(x => [x.type, x.value]));
  const wd = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday);
  return { wd, h: +p.hour + (+p.minute) / 60 };
}
function status() {
  const t = T[lang], { wd, h } = nyNow(), today = HOURS[wd];
  const el = document.getElementById('status');
  if (today && h >= today[0] && h < today[1]) { el.classList.add('open'); return t.open + fmt(today[1]); }
  el.classList.remove('open');
  if (today && h < today[0]) return t.opensToday + fmt(today[0]);
  for (let i = 1; i <= 7; i++) {
    const d = (wd + i) % 7, hrs = HOURS[d];
    if (hrs) return i === 1 ? t.opensTomorrow + fmt(hrs[0]) : t.opensOn + DAYS[lang][d].toLowerCase() + t.at + fmt(hrs[0]);
  }
  return t.closed;
}
function render() {
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : 'en';
  document.querySelectorAll('[data-pt]').forEach(n => { n.innerHTML = n.dataset[lang]; });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  document.getElementById('status-text').textContent = status();
  const { wd } = nyNow(), order = [1,2,3,4,5,6,0];
  document.getElementById('hours').innerHTML = order.map(d => {
    const hrs = HOURS[d];
    return `<li class="${d === wd ? 'today' : ''}"><span data-today="${T[lang].today}">${DAYS[lang][d]}</span><span class="${hrs ? '' : 'off'}">${hrs ? fmt(hrs[0]) + ' – ' + fmt(hrs[1]) : T[lang].off}</span></li>`;
  }).join('');
  document.getElementById('cats').innerHTML = CATS.map(c => `<div class="cat" style="--c:${c.c}"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${c.ic}"/></svg><h3>${c[lang][0]}</h3><p>${c[lang][1]}</p></div>`).join('');
}
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { lang = b.dataset.lang; try { localStorage.setItem('ts-lang', lang); } catch (e) {} render(); }));
render();
setInterval(() => { document.getElementById('status-text').textContent = status(); }, 60000);
</script>
</body>
</html>
